name: opz-lab30

# A local S3: MinIO speaks the same API as AWS S3 and enforces bucket policies
# the same way. `init` creates the bucket and applies infra/init.sh, which is
# this lab's "infrastructure as code" (think: the Terraform for the bucket).
services:
  s3:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    entrypoint: ["/opt/bitnami/minio/bin/minio"]
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    tmpfs:
      - /data:mode=1777
    ports:
      - "127.0.0.1:${S3_PORT:-9030}:9000"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 1s
      retries: 30

  init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    entrypoint: ["bash", "/infra/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./infra:/infra:ro
      - ./sample:/sample:ro
    depends_on:
      s3:
        condition: service_healthy
